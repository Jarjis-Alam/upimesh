-container hover:bg-surface-container-high active:scale-95 text-on-surface font-telemetry-sm text-telemetry-sm transition-all" onclick="adjustAmount(100)">+₹100</button><button class="h-9 px-4 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 text-on-surface font-telemetry-sm text-telemetry-sm transition-all" onclick="adjustAmount(500)">+₹500</button></div></div><div class="grid grid-cols-3 gap-2.5 w-full"><button class="h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface font-telemetry-lg text-telemetry-lg font-bold transition-all" onclick="pressKey('1')">1</button><button class="h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface font-telemetry-lg text-telemetry-lg font-bold transition-all" onclick="pressKey('2')">2</button><button class="h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface font-telemetry-lg text-telemetry-lg font-bold transition-all" onclick="pressKey('3')">3</button><button class="h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface font-telemetry-lg text-telemetry-lg font-bold transition-all" onclick="pressKey('4')">4</button><button class="h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface font-telemetry-lg text-telemetry-lg font-bold transition-all" onclick="pressKey('5')">5</button><button class="h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 flex items-center justify-center text-on-surface font-telemetry-lg text-telemetry-lg font-bold transition-all" onclick="pressKey('6')">6</button><button class="h-14 rounded-full bg-surface-container hover:bg-surface-conta <script>
  let currentAmount = "120";

  function updateDisplay() {
    const valEl = document.getElementById('amount-val');
    const ctaEl = document.getElementById('cta-label');
    const displayNum = currentAmount === "" ? "0" : currentAmount;
    if (valEl) valEl.innerText = displayNum;
    if (ctaEl) ctaEl.innerText = "Sign & Beam Payment ₹" + displayNum;
  }

  function pressKey(num) {
    if (currentAmount === "0") currentAmount = "";
    if (currentAmount.length < 5) {
      currentAmount += num;
      updateDisplay();
    }
  }

  function backspaceKey() {
    currentAmount = currentAmount.slice(0, -1);
    if (currentAmount === "") currentAmount = "0";
    updateDisplay();
  }

  function clearKey() {
    currentAmount = "0";
    updateDisplay();
  }

  function adjustAmount(delta) {
    let numeric = parseInt(currentAmount || "0", 10);
    numeric = Math.min(286, numeric + delta);
    currentAmount = numeric.toString();
    updateDisplay();
  }

  function setMaxAmount() {
    currentAmount = "286";
    updateDisplay();
  }

  // Peer Mode Selectors
  const modeBle = document.getElementById('mode-ble');
  const modeSound = document.getElementById('mode-sound');
  const modeQr = document.getElementById('mode-qr');

  function setMode(activeBtn) {
    [modeBle, modeSound, modeQr].forEach(btn => {
      btn.className = "flex-1 min-w-[110px] flex items-center justify-center gap-1.5 py-2 px-3 rounded-full bg-surface-container-low text-on-surface-variant hover:text-on-surface transition-all";
    });
    activeBtn.className = "flex-1 min-w-[110px] flex items-center justify-center gap-1.5 py-2 px-3 rounded-full bg-primary-container text-on-primary shadow-[0_0_20px_-2px_rgba(250,204,21,0.35)] transition-all";
  }

  if (modeBle) modeBle.addEventListener('click', () => setMode(modeBle));
  if (modeSound) modeSound.addEventListener('click', () => setMode(modeSound));
  if (modeQr) modeQr.addEventListener('click', () => setMode(modeQr));

  // Execution micro-interaction
  function executeBeam() {
    const btn = document.getElementById('beam-btn');
    const toast = document.getElementById('beam-toast');
    if (!btn || !toast) return;

    btn.classList.add('opacity-80', 'scale-95');
    btn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">sync</span><span>Signing with SE Key...</span>';

    setTimeout(() => {
      btn.classList.remove('opacity-80', 'scale-95');
      btn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>Beamed to Terminal</span>';
      toast.classList.remove('hidden');

      setTimeout(() => {
        toast.classList.add('hidden');
        updateDisplay();
      }, 3200);
    }, 900);
  }
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe pointer-events-none" data-active-classes="bg-primary-container text-on-primary shadow-[0_0_24px_-4px_rgba(250,204,21,0.4)]"><div class="pointer-events-auto relative mx-auto mb-4 w-[calc(100%-2rem)] max-w-md h-16 rounded-full flex items-center justify-around px-space-xs overflow-hidden transition-all duration-300" style="background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(15, 17, 24, 0.22) 100%); backdrop-filter: blur(28px) saturate(220%); border-width: 1px; border-style: solid; border-color: rgba(255, 255, 255, 0.6) rgba(255, 255, 255, 0.3) rgba(255, 255, 255, 0.12); box-shadow: rgba(255, 255, 255, 0.55) 0px 1.5px 1.5px 0px inset, rgba(0, 0, 0, 0.35) 0px -1px 2px 0px inset, rgba(0, 0, 0, 0.8) 0px 20px 48px -10px, rgba(250, 204, 21, 0.14) 0px 0px 28px 0px;"><div class="pointer-events-none absolute inset-0 rounded-full opacity-60" style="background: linear-gradient(115deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 35%, transparent 60%, rgba(250, 204, 21, 0.06) 100%);"></div><div class="pointer-events-none absolute -top-3 left-1/4 w-1/2 h-4 rounded-full blur-sm opacity-50 bg-white"></div><a class="relative z-10 flex flex-col items-center justify-center gap-1 min-w-[64px] h-12 rounded-full text-on-surface-variant transition-all duration-200 hover:text-on-surface hover:bg-white/5" data-path="wallets" href="#"><span class="material-symbols-outlined text-[20px]">account_balance_wallet</span><span class="font-label-caps text-label-caps leading-none">Wallets</span></a><a aria-current="page" class="relative z-10 flex flex-col items-center justify-center gap-1 min-w-[64px] h-12 rounded-full transition-all duration-200 text-on-primary font-bold" data-path="pay" href="#" style="background: linear-gradient(145deg, #fde047 0%, #facc15 60%, #eab308 100%); border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.6), inset 0 -1px 1px 0 rgba(0, 0,
