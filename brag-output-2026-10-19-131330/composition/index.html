<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>MeshPay — Offline UPI Brag</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: Hook — 0:00-0:03 -->
      <div
        id="scene1"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="3"
      ></div>

      <!-- Scene 2: Peer Discovery — 0:03-0:08 -->
      <div
        id="scene2"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="3"
        data-duration="5"
      ></div>

      <!-- Scene 3: Settlement — 0:08-0:13 -->
      <div
        id="scene3"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="8"
        data-duration="5"
      ></div>

      <!-- Scene 4: Proof Block — 0:13-0:17 -->
      <div
        id="scene4"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="13"
        data-duration="4"
      ></div>

      <!-- Scene 5: Logo Outro — 0:17-0:20 -->
      <div
        id="scene5"
        data-composition-id="scene5"
        data-composition-src="compositions/scene5.html"
        data-start="17"
        data-duration="3"
      ></div>

      <!-- Background Music — vol-12, steady cinematic -->
      <audio
        id="bgm"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.30"
        data-fade-out="1.5"
      ></audio>

      <!-- SFX: "Paid." slam at 2.1s — beat-locked feel -->
      <audio
        id="sfx-hook-slam"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"
        data-start="2.1"
        data-duration="0.18"
        data-track-index="11"
        data-volume="0.80"
      ></audio>

      <!-- SFX: Peer node float-up at 5.2s -->
      <audio
        id="sfx-peer-appear"
        src="assets/sfx/interface/drop_001.ogg"
        data-start="5.2"
        data-duration="0.11"
        data-track-index="12"
        data-volume="0.65"
      ></audio>

      <!-- SFX: SETTLED text — beat-locked to 13.1s (strong cue 13.11s) -->
      <audio
        id="sfx-settled"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
        data-start="13.1"
        data-duration="0.60"
        data-track-index="13"
        data-volume="0.80"
      ></audio>

      <!-- SFX: Proof line 1 -->
      <audio
        id="sfx-proof-1"
        src="assets/sfx/interface/drop_001.ogg"
        data-start="13.7"
        data-duration="0.11"
        data-track-index="14"
        data-volume="0.40"
      ></audio>

      <!-- SFX: Proof line 2 -->
      <audio
        id="sfx-proof-2"
        src="assets/sfx/interface/drop_001.ogg"
        data-start="14.25"
        data-duration="0.11"
        data-track-index="15"
        data-volume="0.40"
      ></audio>

      <!-- SFX: Proof line 3 -->
      <audio
        id="sfx-proof-3"
        src="assets/sfx/interface/drop_001.ogg"
        data-start="14.77"
        data-duration="0.11"
        data-track-index="16"
        data-volume="0.40"
      ></audio>

      <!-- SFX: Logo bell — beat-locked to 17.47s -->
      <audio
        id="sfx-logo-bell"
        src="assets/sfx/impact/impactBell_heavy_003.ogg"
        data-start="17.4"
        data-duration="0.65"
        data-track-index="17"
        data-volume="0.75"
      ></audio>
    </div>
  </body>
</html>
