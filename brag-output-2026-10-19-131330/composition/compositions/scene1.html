<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    html, body { width: 1920px; height: 1080px; background: #000000; overflow: hidden; }
    #root { width: 1920px; height: 1080px; position: relative; }

    /* Yellow radar pulse rings */
    .radar-pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 230, 0, 0.25);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .r-1 { width: 320px; height: 320px; }
    .r-2 { width: 640px; height: 640px; }
    .r-3 { width: 960px; height: 960px; }
    .r-4 { width: 1040px; height: 1040px; }

    /* Glow backdrop */
    .ambient-glow {
      position: absolute;
      left: 65%; top: 50%;
      transform: translate(-50%, -50%);
      width: 750px; height: 500px;
      background: radial-gradient(circle, rgba(255, 230, 0, 0.12) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* Scene Layout */
    .scene-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 90px;
      padding: 0 100px;
    }

    /* iPhone 14 Pro Mockup */
    .device-iphone {
      width: 380px;
      height: 740px;
      border-radius: 54px;
      background: #09090B;
      border: 4px solid #27272A;
      box-shadow: 
        0 0 0 2px rgba(255, 230, 0, 0.2),
        0 30px 80px rgba(0, 0, 0, 0.9),
        0 0 60px rgba(255, 230, 0, 0.08);
      position: relative;
      padding: 16px;
      transform: perspective(1200px) rotateY(12deg) rotateX(4deg);
      opacity: 0;
      flex-shrink: 0;
    }

    /* Dynamic Island */
    .iphone-island {
      width: 124px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      margin: 4px auto 14px auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .island-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #18181B;
      border: 1.5px solid #27272A;
    }

    /* Screen UI */
    .iphone-screen {
      height: calc(100% - 50px);
      border-radius: 40px;
      background: #0A0A0D;
      border: 1px solid rgba(255, 230, 0, 0.15);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* iOS Status bar */
    .ios-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #9CA3AF;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    .ios-no-service {
      color: var(--yellow);
      font-weight: 700;
      background: rgba(255, 230, 0, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* User Profile Card */
    .user-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
    }
    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
    }
    .user-bal {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #9CA3AF;
    }

    /* Payment Card */
    .payment-card {
      background: rgba(255, 230, 0, 0.06);
      border: 1.5px solid rgba(255, 230, 0, 0.35);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      position: relative;
      margin-bottom: auto;
    }
    .card-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 12px;
    }
    .card-amount {
      font-family: 'Manrope', sans-serif;
      font-size: 52px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .card-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #9CA3AF;
    }

    /* Broadcast button */
    .btn-pay {
      background: var(--yellow);
      color: #000000;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 18px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 230, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Hook Typography Block */
    .hook-text-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .hook-badge {
      margin-bottom: 12px;
      align-self: flex-start;
      opacity: 0;
    }
    .line-no-internet {
      font-family: 'Manrope', sans-serif;
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(40px);
      line-height: 1.05;
    }
    .line-paid {
      font-family: 'Manrope', sans-serif;
      font-size: 130px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--yellow);
      text-shadow: 0 0 60px rgba(255, 230, 0, 0.6), 0 0 120px rgba(255, 230, 0, 0.3);
      white-space: nowrap;
      opacity: 0;
      transform: scale(0.85);
      line-height: 1;
    }
    .hook-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #D1D5DB;
      letter-spacing: 0.02em;
      margin-top: 16px;
      opacity: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="scene1" data-start="0" data-duration="3">
  <div class="cyber-grid"></div>
  <div class="cyber-vignette"></div>
  <div class="scanlines"></div>

  <!-- HUD markers -->
  <div class="hud-corner hud-tl">PROTOCOL: UPIMESH // AIR-GAP V1.0</div>
  <div class="hud-corner hud-tr">
    <div class="hud-dot"></div>
    <span>HARDWARE READY</span>
  </div>

  <!-- Radar background rings -->
  <div class="radar-pulse-ring r-1"></div>
  <div class="radar-pulse-ring r-2"></div>
  <div class="radar-pulse-ring r-3"></div>
  <div class="radar-pulse-ring r-4"></div>
  <div class="ambient-glow"></div>

  <!-- Main visual content -->
  <div class="scene-content">
    <!-- iPhone 14 Pro Device -->
    <div class="device-iphone" id="iphoneDevice">
      <div class="iphone-island">
        <div class="island-lens"></div>
      </div>
      <div class="iphone-screen">
        <div class="ios-status">
          <span>9:41</span>
          <span class="ios-no-service">NO SERVICE ✕</span>
          <span>100% ⚡</span>
        </div>

        <div class="user-pill">
          <div style="display: flex; align-items: center; gap: 12px;">
            <img src="../assets/icon.png" alt="MeshPay Icon" style="width: 36px; height: 36px; border-radius: 9px; border: 1px solid rgba(255, 230, 0, 0.4);" />
            <div>
              <div class="user-name">Alice</div>
              <div class="user-bal">UPI: alice@okaxis</div>
            </div>
          </div>
          <div class="badge-yellow-outline" style="font-size: 10px; padding: 3px 8px;">WALLET</div>
        </div>

        <div class="payment-card">
          <div class="card-tag">OFFLINE VOUCHER</div>
          <div class="card-amount">₹100</div>
          <div class="card-sub">RSA-PSS 2048 • BANK SIGNED</div>
        </div>

        <div class="btn-pay" id="payBtn">
          <span>BROADCAST P2P</span>
          <span>→</span>
        </div>
      </div>
    </div>

    <!-- Hook Typography -->
    <div class="hook-text-block">
      <div class="badge-yellow-outline hook-badge" id="hookBadge">
        <span>⚡ P2P MESH TRANSFER</span>
      </div>
      <div class="line-no-internet" id="lineNoInternet">Zero Internet.</div>
      <div class="line-paid" id="linePaid">PAID.</div>
      <div class="hook-desc" id="hookDesc">Cryptographic offline UPI over AWDL &amp; BLE</div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["scene1"] = tl;

  // iPhone slides into view
  tl.to("#iphoneDevice", {
    opacity: 1,
    y: 0,
    rotationY: 8,
    duration: 0.6,
    ease: "power3.out"
  }, 0.2);

  // Hook badge
  tl.to("#hookBadge", {
    opacity: 1,
    duration: 0.3,
    ease: "power2.out"
  }, 0.4);

  // "Zero Internet."
  tl.to("#lineNoInternet", {
    opacity: 1,
    x: 0,
    duration: 0.45,
    ease: "power3.out"
  }, 0.6);

  // "PAID." slams in hard
  tl.to("#linePaid", {
    opacity: 1,
    scale: 1,
    duration: 0.35,
    ease: "back.out(1.6)"
  }, 1.9);

  // Button pulse on iPhone
  tl.to("#payBtn", {
    scale: 0.95,
    duration: 0.15,
    yoyo: true,
    repeat: 1,
    ease: "power1.inOut"
  }, 1.9);

  // Description fades in
  tl.to("#hookDesc", {
    opacity: 1,
    duration: 0.4,
    ease: "power2.out"
  }, 2.2);
</script>
</body>
</html>
