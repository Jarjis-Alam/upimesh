# Production Deployment Security Configuration
# Activated when spring.profiles.active=prod or spring.profiles.active=production

# 1. Development owner-key provisioning strictly disabled
upimesh.dev-key-provisioning-enabled=false
upimesh.dev-provisioning-token=

# Demo authentication strictly disabled in production (fails closed)
upimesh.demo-auth-enabled=false

# 2. H2 Web Console strictly disabled in production
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# 3. Suppress all internal error messages, stack traces, and binding errors
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# 4. JPA DDL Auto: Never drop or mutate production schema automatically
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
