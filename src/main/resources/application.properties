spring.application.name=upimesh

# File-backed H2 database for persistent development runtime across application restarts
spring.datasource.url=jdbc:h2:file:./data/upimesh;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Maintain schema across restarts without dropping existing tables or data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.order_updates=true

# H2 Web Console restricted to localhost for secure local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# API Error Handling: Never leak stack traces or internal implementation details
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

# Owner-key enrollment is disabled by default for safety. Production requires bank-issued identity infrastructure.
upimesh.dev-key-provisioning-enabled=false
# Secret token required for development key provisioning when enabled; left unconfigured by default (fail-closed)
upimesh.dev-provisioning-token=

# Controlled demo authentication: DISABLED by default for security
# Requires an explicitly configured secret (UPI_MESH_ADMIN_TOKEN or upimesh.admin-token) for administrative access
upimesh.demo-auth-enabled=false

# Bank Authority Key Authenticated Encryption at Rest (AES-256-GCM)
# Required in production profile; optional in development
# When configured, newly generated keys are encrypted at rest with AES-GCM
# upimesh.bank-authority.encryption-key=
# Optional opt-in to migrate legacy unencrypted database keys to AES-GCM encrypted format
upimesh.bank-authority.auto-migrate-encryption=false
