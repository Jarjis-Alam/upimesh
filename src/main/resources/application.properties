spring.application.name=upimesh

# File-backed H2 database for persistent development runtime across application restarts
spring.datasource.url=jdbc:h2:file:./data/upimesh;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Maintain schema across restarts without dropping existing tables or data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console restricted to localhost for secure local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# API Error Handling: Never leak stack traces or internal implementation details
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
