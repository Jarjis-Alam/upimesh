# Isolated in-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:upimesh_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fresh schema per test run, avoiding pollution of development data in ./data/upimesh
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Development owner-key provisioning enabled for isolated test suites
upimesh.dev-key-provisioning-enabled=true
upimesh.dev-provisioning-token=stage88-test-dev-provisioning-secret-xyz

